[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-research-os"
version = "5.1.0"
description = "Research controls with MCP approval, access holds, revision-bound evidence review and reproducible evaluation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["reportlab>=4.2,<5"]

[project.scripts]
atlas = "atlas.__main__:main"

[tool.setuptools]
packages = ["atlas"]
